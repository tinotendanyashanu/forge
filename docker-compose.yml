# Local development database for FORGE.
# Credentials here are for local development only; never reuse them elsewhere.
name: forge

services:
  postgres:
    image: postgres:16-alpine
    container_name: forge-postgres
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - forge-pgdata:/var/lib/postgresql/data
      # Creates the separate forge_test database used by pytest.
      - ./api/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  forge-pgdata:
