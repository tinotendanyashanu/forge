# Versioned assessment templates. Sections compose existing FORGE modules:
#   interview -> M3 AI interviewer   coding -> M5 coding lab (verified sandbox only)
#   design    -> M6 architecture lab  incident -> M7 FORGE OPS
#   judgment  -> engineering judgment scenarios  take_home -> take-home project
# Section weights only summarise the attempt; readiness comes from the gated
# competency model, never from a weighted average.

[[templates]]
slug = "fullstack-mid"
title = "Full-Stack Engineer: mid-level readiness"
track = "fullstack"
level = "mid"
purpose = "formal"
time_limit_minutes = 300
description = "A formal, timed assessment of mid-level full-stack competency across backend, frontend, data, design, production and judgment."
objectives = ["Implement and test backend and frontend logic", "Explain technical decisions under follow-up questions", "Design a feature-level system with explicit trade-offs", "Investigate and mitigate a production incident safely", "Make and communicate sound engineering decisions"]
passing_criteria = "Every gated competency for Full-Stack mid-level is demonstrated in the readiness report; no critical failure."
critical_failures = ["A harmful action during the incident simulation", "Executable coding sections unavailable (no verified sandbox): the attempt cannot establish implementation evidence", "A gated competency with a demonstrated weakness"]
evidence_requirements = "Verified coding results, a deterministic incident outcome, an evaluated architecture, AI-evaluated interview and judgment answers. AI judgments are advisory and never sufficient alone."

[[templates.sections]]
key = "interview-backend"
kind = "interview"
title = "Technical interview: backend"
objectives = ["Explain FastAPI behaviour and backend trade-offs", "Answer follow-up questions without hints"]
dimensions = ["python_backend", "api_design"]
weight = 1.0
minutes = 30
params = { skill = "fastapi", difficulty = "intermediate", mode = "grill", questions = 2 }

[[templates.sections]]
key = "interview-frontend"
kind = "interview"
title = "Technical interview: frontend"
objectives = ["Explain React state, effects and rendering trade-offs"]
dimensions = ["react_nextjs", "javascript_typescript"]
weight = 1.0
minutes = 25
params = { skill = "react", difficulty = "intermediate", mode = "grill", questions = 2 }

[[templates.sections]]
key = "coding"
kind = "coding"
title = "Coding challenges"
objectives = ["Implement correct, validated solutions that pass hidden tests"]
dimensions = ["python_backend", "javascript_typescript", "database_engineering", "programming_fundamentals"]
weight = 2.0
minutes = 90
critical = true
params = { picks = [{ skill = "fastapi", difficulty = "intermediate" }, { skill = "typescript", difficulty = "intermediate" }, { skill = "sql", difficulty = "intermediate" }] }

[[templates.sections]]
key = "design"
kind = "design"
title = "System design exercise"
objectives = ["Clarify requirements and propose an architecture", "Defend decisions; adapt when constraints change"]
dimensions = ["system_architecture", "distributed_systems", "concurrency_consistency"]
weight = 1.5
minutes = 60
params = { level = "intermediate", constraint_changes = ["traffic-10x", "duplicate-delivery", "payment-timeout", "postgres-unavailable"] }

[[templates.sections]]
key = "incident"
kind = "incident"
title = "Production incident"
objectives = ["Triage, investigate and mitigate safely", "Verify recovery and explain the root cause"]
dimensions = ["production_reliability", "debugging", "devops_deployment"]
weight = 1.5
minutes = 45
critical = true
params = { level = "intermediate" }

[[templates.sections]]
key = "judgment"
kind = "judgment"
title = "Engineering judgment scenarios"
objectives = ["Make justified decisions and communicate them"]
dimensions = ["engineering_judgment", "technical_communication", "code_review_maintainability"]
weight = 1.0
minutes = 40
params = { count = 2, level = "mid", include = ["review-junior-pr"] }

