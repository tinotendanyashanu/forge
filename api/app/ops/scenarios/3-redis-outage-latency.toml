level = "intermediate"

[[scenarios]]
slug = "redis-outage-latency"
title = "Product pages slow down every few minutes"
summary = "Product-page latency spikes in waves, and the database is working harder than ever. The cache keeps restarting. Find out what is killing it."
business_context = "Harbor Outdoor's catalog-api serves product pages from Redis (6 GB memory limit on the container), with PostgreSQL behind it. A recommendations feature launched yesterday. Slow product pages directly reduce conversion during a holiday sale."
skills = ["devops", "distributed-systems", "system-design"]
competencies = ["performance_analysis", "distributed_systems", "observability", "reliability", "root_cause_analysis"]
learning_outcomes = [
  "Recognise a cold-cache stampede: hit rate collapses, database load rises, latency follows.",
  "Read container restart reasons (OOMKilled) and memory growth to find why a cache dies.",
  "Separate the trigger (keys without TTL) from the amplifier (slow cache timeouts on misses).",
  "Prefer stopping the growth over resizing or flushing under pressure.",
]
initial_symptoms = [
  "Alert: catalog-api p95 latency above 1.5 s, recurring roughly every 15 minutes.",
  "Alert: orders-db CPU above 85%.",
  "Redis container restarted 3 times in the last hour.",
]
customer_impact = "Product pages take 2-4 seconds for a few minutes after each cache restart; some time out."
start_time = "2026-11-28T18:00:00Z"
history = [[-120, "healthy"], [-60, "growing"], [-4, "cold"]]
initial_condition = "cold"
verify_minutes = 6
target_minutes = 25

spoiler_terms = ["ttl", "no expiry", "without expiry", "never expire", "reco:", "recommendation keys", "recommendations cache", "maxmemory", "noeviction"]
key_evidence = ["redis-info", "log-oomkilled", "deploy-reco-diff", "key-sample"]
contributing_factors = [
  "Redis maxmemory was not set, so the kernel OOM-killed the container instead of Redis evicting keys.",
  "catalog-api waits up to 2 s on cache operations, so a cache problem becomes a latency problem.",
  "No request coalescing: every miss hits PostgreSQL, so restarts cause a stampede.",
  "No alert on Redis memory growth or key count.",
]
investigation_path = [
  "See the sawtooth: latency spikes line up with Redis restarts.",
  "Check why Redis restarts: OOMKilled at the 6 GB container limit.",
  "Check what fills memory: millions of reco:* keys with no TTL.",
  "Line up the timeline: growth started with catalog-api v5.2 (recommendations caching).",
  "Disable recommendation caching, then watch hit rate and database CPU recover.",
]
explanation = "catalog-api v5.2 caches per-user recommendations with SET but no expiry. Keys accumulate until Redis reaches the container's 6 GB limit; with no maxmemory configured, Redis doesn't evict and the kernel OOM-kills it. It restarts empty, product lookups all miss, every miss waits on a fresh connection and then queries PostgreSQL, and latency spikes until the cache warms, then the cycle repeats. The fix is to stop the unbounded growth (flag off, then TTLs and maxmemory with an eviction policy)."
prevention = [
  "Set TTLs on every cache key (lint or wrapper that requires one).",
  "Configure maxmemory below the container limit with allkeys-lru for cache instances.",
  "Short cache timeouts and a circuit breaker so cache failures degrade to misses quickly.",
  "Request coalescing for hot keys to avoid stampedes after a cold start.",
  "Alert on Redis used_memory growth and evictions.",
]

