[[scenarios.actions]]
id = "redis_info"
kind = "investigate"
label = "Inspect Redis INFO and restart reasons"
description = "Memory, policy, keys, hit rate."
minutes = 2
quality = "helpful"
teach = "No maxmemory, noeviction, 10 M keys before the crash: Redis grew until the container was OOM-killed."

[[scenarios.actions]]
id = "key_sample"
kind = "investigate"
label = "Sample key patterns and TTLs"
description = "Which keys use the memory, and do they expire?"
minutes = 3
requires_actions = ["redis_info"]
quality = "helpful"
teach = "reco:user:* keys take 5.4 GB and none expire."

[[scenarios.actions]]
id = "review_diff"
kind = "investigate"
label = "Review the catalog-api v5.2.0 diff"
description = "Open the recommendations caching change."
minutes = 2
quality = "helpful"
teach = "redis.set without ex= creates keys that live forever."

[[scenarios.actions]]
id = "db_status"
kind = "investigate"
label = "Inspect catalog-db load"
description = "CPU, connections, query mix."
minutes = 2
command = "database-status"
teach = "The database is busy only because the cache is cold: same queries, no locks. A consequence, not a cause."

[[scenarios.actions]]
id = "disable_flag"
kind = "mitigate"
discovered_by = ["review_diff", "key_sample"]
label = "Disable feature flag cache_recommendations"
description = "Serve recommendations uncached; stop writing reco keys."
minutes = 1
quality = "correct"
transitions = { cold = "stopped_growth_cold", refilling = "stopped_growth", growing = "stopped_growth", flushed = "stopped_growth_cold" }
outcome = { cold = "No more reco keys are written. The cache is still cold, but it can now warm up and stay up.", default = "No more reco keys are written. Memory stops growing." }
teach = "Stops the unbounded growth immediately and is reversible. Uncached recommendations are cheap enough to serve directly."

[[scenarios.actions]]
id = "set_maxmemory"
kind = "mitigate"
discovered_by = ["redis_info"]
label = "Set maxmemory 5gb with allkeys-lru (CONFIG SET)"
description = "Let Redis evict keys instead of being OOM-killed."
minutes = 1
quality = "helpful"
transitions = { cold = "stopped_growth_cold", refilling = "stopped_growth", growing = "stopped_growth" }
outcome = { default = "Redis now evicts least-recently-used keys at 5 GB instead of crashing. Recommendation keys will churn product keys out of the cache until the code is fixed." }
teach = "A sound safety net that stops the crash loop. On its own it lets reco keys compete with product keys, so fix the TTLs too."

[[scenarios.actions]]
id = "raise_limit"
kind = "mitigate"
label = "Raise the Redis container memory limit to 12 GB"
description = "Restart Redis with a bigger memory limit."
minutes = 2
quality = "risky"
mistake = "scale-without-bottleneck"
transitions = { refilling = "cold", growing = "cold" }
outcome = { default = "Redis restarts with a 12 GB limit. The restart empties the cache again; latency spikes while it refills." }
teach = "More memory only delays the next OOM kill, and the restart itself causes another cold-cache stampede."

[[scenarios.actions]]
id = "flushall"
kind = "mitigate"
discovered_by = ["redis_info"]
label = "FLUSHALL to clear the cache"
description = "Delete every key in Redis."
minutes = 1
quality = "harmful"
mistake = "ignore-data-safety"
transitions = { cold = "flushed", refilling = "flushed", growing = "flushed" }
outcome = { default = "All keys deleted, including warm product and session keys. Every request misses at once." }
teach = "Flushing a cache during a load problem triggers a full stampede and logs users out (sessions)."

[[scenarios.actions]]
id = "scale_db"
kind = "mitigate"
label = "Add two PostgreSQL read replicas"
description = "Provision replicas to absorb read load (about 30 minutes)."
minutes = 3
quality = "risky"
mistake = "scale-without-bottleneck"
outcome = { default = "Replicas are provisioning; they won't be ready for 30 minutes. The cache keeps crashing in the meantime." }
teach = "The database load is a symptom of the cold cache. Fix the cache; don't scale its victim."

[[scenarios.actions]]
id = "longer_timeout"
kind = "mitigate"
label = "Increase catalog-api cache timeout from 2 s to 5 s"
description = "Give Redis more time to answer."
minutes = 1
quality = "harmful"
mistake = "retry-amplification"
outcome = { default = "Requests now wait up to 5 s on a restarting cache before falling back. p99 latency gets worse." }
teach = "Longer timeouts on a failing dependency make every miss slower. Cache timeouts should be short."

[[scenarios.root_causes]]
id = "rc-ttl"
text = "catalog-api v5.2 writes per-user recommendation keys to Redis without a TTL; with no maxmemory, Redis grows until the container is OOM-killed, restarts cold and causes a database stampede."
correct = true
explanation = "Memory grows in a sawtooth that matches OOMKilled restarts. 9.6 M reco:user:* keys with no TTL use 5.4 GB. Each restart empties the cache, misses hit PostgreSQL and latency spikes until the cache refills."

[[scenarios.root_causes]]
id = "rc-db"
text = "PostgreSQL is overloaded after the work_mem change and autovacuum, slowing product lookups."
explanation = "Database load rises only after each cache restart; the parameter change was days ago, and autovacuum is routine."

[[scenarios.root_causes]]
id = "rc-traffic"
text = "Holiday-sale traffic exceeds catalog-api capacity."
explanation = "Traffic is flat; latency spikes are periodic and line up with Redis restarts."

[[scenarios.root_causes]]
id = "rc-network"
text = "Network instability between catalog-api and Redis causes timeouts."
explanation = "Timeouts happen only while Redis is restarting after OOM kills; there are no timeouts between restarts."

[[scenarios.misleading_signals]]
signal = "PostgreSQL CPU at 91%"
why = "A consequence of the cold cache: the same queries, which Redis normally absorbs, all reach the database at once."

[[scenarios.misleading_signals]]
signal = "Autovacuum and a recent work_mem change"
why = "Routine maintenance and an old parameter change; neither lines up with the periodic spikes."

[scenarios.rubric_focus]
diagnostic_accuracy = "TTL-less keys growing to the container limit; OOM kill and cold-cache stampede."
evidence_quality = "OOMKilled restarts, INFO memory and policy, reco:user key sample, v5.2 diff."
mitigation_safety = "Flag off and/or maxmemory+LRU; no FLUSHALL, no longer timeouts, no blind resizing."
technical_reasoning = "Explains trigger (growth) vs amplifier (slow fallback, no coalescing)."
