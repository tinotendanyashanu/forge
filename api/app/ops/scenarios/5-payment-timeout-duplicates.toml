level = "advanced"

[[scenarios]]
slug = "payment-timeout-duplicates"
title = "Payment timeouts, and customers charged twice"
summary = "Checkout payments are timing out, and support has the first reports of double charges. Stop the damage without losing real payments."
business_context = "Cobalt Gear's checkout-service charges cards through an external payment provider (3 s client timeout, automatic retries). It's the first day of a product drop. Every duplicate charge becomes a refund, a support ticket and a trust problem; every failed checkout is a lost sale."
skills = ["distributed-systems", "http", "devops"]
competencies = ["distributed_systems", "reliability", "http_debugging", "technical_communication", "root_cause_analysis"]
learning_outcomes = [
  "Recognise that a timeout means 'outcome unknown', not 'failed', for side-effecting calls.",
  "Find how retries without idempotency keys turn timeouts into duplicate charges.",
  "See how your own retries amplify a dependency's partial degradation.",
  "Choose mitigations that protect money first, and avoid irreversible bulk actions.",
]
initial_symptoms = [
  "Alert: checkout payment error rate above 15%.",
  "Support: 6 customers report two identical charges for one order.",
  "Payment provider latency on our dashboards is above 4 s.",
]
customer_impact = "About one in five checkouts fails; an unknown number of customers have been charged two or three times."
start_time = "2026-09-04T16:00:00Z"
history = [[-120, "healthy"], [-16, "provider_slow"]]
initial_condition = "provider_slow"
verify_minutes = 6
target_minutes = 25

spoiler_terms = ["idempotency", "idempotency-key", "idempotency key", "concurrency limit", "retry amplification"]
key_evidence = ["recon-report", "diff-idempotency", "log-dup-charge", "provider-status"]
contributing_factors = [
  "The HTTP client refactor had no test asserting the Idempotency-Key header.",
  "Retries had no jitter or budget, so they tripled traffic during degradation.",
  "A timeout is reported to the customer as a failure even though the charge may have succeeded.",
  "No reconciliation alert compares provider charges with orders in near real time.",
  "Product-drop traffic took the merchant close to the provider's concurrency limit.",
]
investigation_path = [
  "Treat timeouts as unknown outcomes: check the provider side (reconciliation) for charges without orders or duplicates.",
  "See that each duplicated order has 2-3 charges a few seconds apart: the retry policy.",
  "Find why retries aren't idempotent: v7.3 dropped the Idempotency-Key header.",
  "Read the provider status page: degradation is per merchant, above the concurrency limit, and our retries keep us above it.",
  "Pause retries (stop duplicates and amplification), then restore idempotency keys; reconcile and refund verified duplicates.",
]
explanation = "The provider slowed down for merchants above 200 concurrent requests. checkout-service times out after 3 s and retries up to 3 times. Since v7.3 refactored the HTTP client, the Idempotency-Key header is no longer sent, so each retry is a new charge request; if the original succeeded after our timeout, the customer is charged again. Retries also tripled our concurrency, keeping us above the provider's limit and sustaining the slowdown. Pausing retries removes both the duplicates and the amplification; restoring idempotency keys makes future retries safe."
prevention = [
  "Always send an idempotency key derived from the order/payment attempt; test for it.",
  "Retry with exponential backoff, jitter and a retry budget; never retry non-idempotent calls blindly.",
  "Model payment outcome as pending on timeout and confirm via webhook or status lookup.",
  "Continuous reconciliation with alerts on charges without orders and duplicate charges.",
  "Know your provider's limits and shed load before you hit them.",
]

