[[scenarios.actions]]
id = "reconciliation"
kind = "investigate"
label = "Run reconciliation: provider charges vs orders"
description = "Compare successful provider charges with paid orders."
minutes = 3
quality = "helpful"
teach = "Timeouts hide successful charges: 262 charges belong to 'failed' orders and 43 orders were charged more than once."

[[scenarios.actions]]
id = "review_diff"
kind = "investigate"
label = "Review the checkout-service v7.3.0 diff"
description = "Open the payment client refactor."
minutes = 2
quality = "helpful"
teach = "The shared wrapper retries automatically and dropped the Idempotency-Key header."

[[scenarios.actions]]
id = "provider_status"
kind = "investigate"
label = "Check the payment provider status page"
description = "Read the provider's incident notes."
minutes = 1
quality = "helpful"
teach = "The provider slows merchants above their concurrency limit, and says idempotent retries are safe."

[[scenarios.actions]]
id = "retry_breakdown"
kind = "investigate"
label = "Break down provider requests per order"
description = "How many charge attempts each order makes."
minutes = 2
quality = "helpful"
teach = "Retries roughly triple provider traffic, keeping us above the 200 concurrency limit."

[[scenarios.actions]]
id = "db_health"
kind = "investigate"
label = "Check orders-db health"
description = "Load, deadlocks, uniqueness."
minutes = 1
command = "database-status"
teach = "The database is fine; the deadlock is an unrelated job and orders themselves aren't duplicated: charges are."

[[scenarios.actions]]
id = "pause_retries"
kind = "mitigate"
discovered_by = ["retry_breakdown", "review_diff", "reconciliation"]
label = "Disable automatic payment retries (flag payment_auto_retry)"
description = "On timeout, show 'payment pending' and confirm later instead of retrying."
minutes = 1
quality = "correct"
transitions = { provider_slow = "no_retries", safe_retries = "no_retries", retry_storm = "no_retries" }
outcome = { default = "Retries off. Provider traffic drops to one request per order; no new duplicate charges can be created." }
teach = "Stops the money-losing behaviour immediately and removes the load amplification. Reversible with a flag."

[[scenarios.actions]]
id = "enable_idempotency"
kind = "mitigate"
discovered_by = ["review_diff"]
label = "Hotfix: restore Idempotency-Key on charge requests"
description = "Add order-based idempotency keys in the shared client call (build and deploy)."
minutes = 3
requires_actions = ["review_diff"]
quality = "correct"
transitions = { provider_slow = "safe_retries", retry_storm = "safe_retries" }
outcome = { provider_slow = "Retries are now safe: the provider de-duplicates them. They still add load.", no_retries = "Keys restored. When retries are re-enabled they'll be safe.", default = "Idempotency keys restored." }
deployment = { service = "checkout", version = "v7.3.1", summary = "Restore Idempotency-Key header" }
teach = "Fixes the defect that turns retries into duplicate charges. Pair it with backoff before re-enabling retries."

[[scenarios.actions]]
id = "pending_mode"
kind = "mitigate"
discovered_by = ["reconciliation", "provider_status"]
label = "Switch checkout to asynchronous payment confirmation"
description = "Accept the order as 'payment pending' and confirm via provider webhooks."
minutes = 2
quality = "helpful"
transitions = { provider_slow = "pending_mode", safe_retries = "pending_mode", retry_storm = "pending_mode" }
outcome = { default = "Checkout no longer retries synchronously; customers see 'payment pending' and get an email when confirmed." }
teach = "Turns unknown outcomes into an explicit pending state. A strong design, if the webhook path is already built and tested."

[[scenarios.actions]]
id = "more_retries"
kind = "mitigate"
label = "Increase retries to 5 and the timeout to 10 s"
description = "Give payments more chances to succeed."
minutes = 1
quality = "harmful"
mistake = "retry-amplification"
transitions = { provider_slow = "retry_storm", safe_retries = "retry_storm" }
outcome = { default = "Requests to the provider jump above 1,000 in flight. Latency and payment failures rise sharply." }
teach = "More retries against a saturated dependency make everything worse, and without idempotency each one risks a duplicate charge."

[[scenarios.actions]]
id = "failover_provider"
kind = "mitigate"
label = "Fail over all payments to the backup provider"
description = "Route new charges to the secondary provider."
minutes = 2
quality = "risky"
mistake = "ignore-data-safety"
outcome = { default = "New charges now go to the backup provider. Reconciliation must now cover two providers." }
teach = "Failover can be right for a full outage, but with unknown in-flight outcomes it creates cross-provider duplicates. Stop retries first."

[[scenarios.actions]]
id = "auto_refund"
kind = "mitigate"
discovered_by = ["reconciliation"]
label = "Automatically refund every order with more than one charge"
description = "Bulk refund script over today's charges."
minutes = 2
requires_actions = ["reconciliation"]
quality = "harmful"
mistake = "ignore-data-safety"
outcome = { default = "Refunds issued for 43 orders, including 4 customers who legitimately bought the same item twice. Refunds can't be recalled, and new duplicates keep arriving because retries are still on." }
teach = "Irreversible bulk actions during an incident need verification and a stopped bleed first."

[[scenarios.root_causes]]
id = "rc-retries"
text = "checkout-service v7.3 retries timed-out charge requests without an Idempotency-Key, so slow but successful charges are repeated; the retries also triple load and keep us above the provider's concurrency limit."
correct = true
explanation = "Reconciliation shows duplicates 2-3 s apart starting right after v7.3; the diff shows the header removed and retries=3; the provider throttles merchants above 200 concurrent requests, and retries put us at about 540."

[[scenarios.root_causes]]
id = "rc-provider"
text = "The payment provider had an outage, which is entirely outside our control."
explanation = "The provider degraded only for merchants above their limit; our retries kept us there, and the duplicates are caused by our client, not by the provider."

[[scenarios.root_causes]]
id = "rc-double-click"
text = "Customers double-clicked the pay button during the product drop."
explanation = "The storefront debounces clicks and deduplicates them; duplicate charges come from server-side retries within one request."

[[scenarios.root_causes]]
id = "rc-db"
text = "A database deadlock created duplicate orders."
explanation = "The deadlock was in an unrelated job; orders aren't duplicated (unique constraint), charges are."

[[scenarios.misleading_signals]]
signal = "Provider status page shows an incident"
why = "True but incomplete: the provider only slows merchants above their concurrency limit, and our retries put us there."

[[scenarios.misleading_signals]]
signal = "Deadlock in the database log"
why = "An unrelated inventory job; order rows are unique and healthy."

[[scenarios.misleading_signals]]
signal = "Double-click events in the storefront"
why = "Already debounced and deduplicated in the browser; not the source of duplicate charges."

[scenarios.rubric_focus]
diagnostic_accuracy = "Non-idempotent retries on timeouts (v7.3 header removal) plus retry amplification."
evidence_quality = "Reconciliation duplicates, the diff, provider concurrency 429s, attempts per order."
mitigation_safety = "Pause retries first; no bulk refunds or blind failover; restore idempotency before re-enabling retries."
reliability_awareness = "Treats timeouts as unknown outcomes and plans reconciliation of affected customers."
