level = "senior"

[[scenarios]]
slug = "auth-abuse"
title = "Sign-up surge and failed-login storm"
summary = "Sign-ups jumped 40x, failed logins are in the hundreds of thousands, and real customers can't log in quickly. Decide whether this is growth or an attack, and contain it safely."
business_context = "Lattice Bank's consumer app runs auth-service (bcrypt cost 12) behind an API gateway that enforces rate limits. Verification emails go through an email provider with a sender-reputation score. Account takeover is a regulatory incident; locking out real customers is a reputational one."
skills = ["security", "http", "devops"]
competencies = ["security_response", "http_debugging", "observability", "technical_communication", "root_cause_analysis"]
learning_outcomes = [
  "Tell an attack from organic growth using distribution signals (ASNs, email domains, success ratios).",
  "Find the control that failed (rate limits removed in a gateway migration) rather than only blocking symptoms.",
  "Contain abuse without weakening security controls or locking out legitimate users.",
  "Treat simulated evidence as untrusted input, including attacker-controlled strings in logs.",
]
initial_symptoms = [
  "Alert: sign-ups per minute 40x the weekly baseline.",
  "Alert: auth-service CPU above 90%, login p95 above 3 s.",
  "Email provider warning: bounce rate 31%, sending will be throttled.",
]
customer_impact = "Real customers wait 3-5 s to log in and some time out; verification emails are delayed; an unknown number of accounts may be compromised."
start_time = "2026-08-15T02:10:00Z"
history = [[-120, "healthy"], [-24, "attack"]]
initial_condition = "attack"
verify_minutes = 6
target_minutes = 25

spoiler_terms = ["rate limit", "rate-limit", "rate limits", "ratelimit", "config v31", "gateway config", "rules dropped", "dropped the rules"]
key_evidence = ["gateway-diff", "signup-breakdown", "login-analysis", "log-429-missing"]
contributing_factors = [
  "The gateway config migration (v30 -> v31) had no test asserting rate-limit rules on /auth/*.",
  "No alert on the ratio of failed to successful logins or on sign-ups by ASN.",
  "CAPTCHA was only enabled for 10% of sign-ups as part of an A/B test.",
  "bcrypt verification for unknown usernames still runs full cost (correct), so stuffing directly consumes CPU.",
]
investigation_path = [
  "Look at the shape of the traffic: sign-ups from three hosting ASNs and disposable email domains, logins across 1.2M usernames at a 0.8% success rate.",
  "Ask what normally stops this: gateway rate limits, which haven't returned a single 429 since 01:46.",
  "Read the gateway diff: v31 converted rules to the new format and dropped the /auth/* limits.",
  "Restore the limits (fastest, safest), then add CAPTCHA/ASN controls and protect the compromised accounts.",
]
explanation = "At 01:46 the gateway was migrated to config v31, which converted rate-limit rules to the new schema but silently dropped the rules for /auth/login and /auth/signup. Within minutes automated traffic began credential stuffing (1.2M distinct usernames, 0.8% success = about 300 compromised accounts) and mass fake sign-ups from hosting providers. bcrypt verification for every attempt saturates auth-service CPU, which is why real users are slow. The fix is to restore the missing control, then deal with the consequences (compromised accounts, fake sign-ups, email reputation)."
prevention = [
  "Test that security controls (rate limits, auth rules) exist after any gateway config migration.",
  "Alert on login failure ratio, distinct-username velocity and sign-ups by ASN/email domain.",
  "Layered defences: per-IP, per-account and per-ASN limits, CAPTCHA on risk signals, breached-password checks.",
  "Force password resets and session revocation for accounts with successful logins from flagged sources.",
  "Run the A/B test for CAPTCHA with abuse monitoring, not as the only control.",
]

