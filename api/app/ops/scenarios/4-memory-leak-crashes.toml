[[scenarios.actions]]
id = "pod_status"
kind = "investigate"
label = "Inspect pod restarts and termination reasons"
description = "kubectl describe-style summary for media-api pods."
minutes = 1
command = "service-status"
quality = "helpful"
teach = "Every pod is OOMKilled at the limit on a regular cadence since v4.1.0: a leak, not node pressure."

[[scenarios.actions]]
id = "heap_profile"
kind = "investigate"
label = "Capture a heap profile from a pod near its limit"
description = "tracemalloc snapshot of the largest allocations."
minutes = 3
quality = "helpful"
teach = "One unbounded cache holds 612 MiB of image bytes with a 2% hit rate."

[[scenarios.actions]]
id = "review_diff"
kind = "investigate"
label = "Review the media-api v4.1.0 diff"
description = "Open the code change from the last release."
minutes = 2
quality = "helpful"
teach = "lru_cache(maxsize=None) keyed by full URLs: unbounded by design."

[[scenarios.actions]]
id = "node_status"
kind = "investigate"
label = "Check node memory pressure"
description = "Node conditions and evictions."
minutes = 1
teach = "One node had brief pressure 26 minutes ago and evicted best-effort pods only. Not the cause."

[[scenarios.actions]]
id = "rollback"
kind = "mitigate"
label = "Roll back media-api to v4.0.3"
description = "Redeploy the previous release."
minutes = 1
quality = "correct"
transitions = { leaking = "rolling_back", big_limit = "rolling_back", restarted = "rolling_back", probe_off = "rolling_back" }
outcome = { default = "Rollback started; pods are being replaced with v4.0.3." }
deployment = { service = "api", version = "v4.0.3", summary = "Rollback of v4.1.0" }
teach = "Removes the leak with a known-good version; thumbnails get a little slower, which the CDN absorbs."

[[scenarios.actions]]
id = "hotfix_bound"
kind = "mitigate"
discovered_by = ["heap_profile", "review_diff"]
label = "Ship hotfix v4.1.1: lru_cache(maxsize=256) and strip tracking params from the key"
description = "Bound the cache and normalise keys (build and roll out, about 5 minutes)."
minutes = 1
requires_actions = ["heap_profile"]
quality = "helpful"
transitions = { leaking = "bounded", big_limit = "bounded", restarted = "bounded", probe_off = "bounded" }
outcome = { default = "Hotfix building and rolling out." }
deployment = { service = "api", version = "v4.1.1", summary = "Bound thumbnail cache" }
teach = "A real fix, justified by the heap profile. Slightly more risk than a rollback under pressure, but keeps the speed-up."

[[scenarios.actions]]
id = "raise_limit"
kind = "mitigate"
label = "Raise media-api memory limit to 2 GiB"
description = "Update the deployment's resources."
minutes = 2
quality = "risky"
mistake = "scale-without-bottleneck"
transitions = { leaking = "big_limit" }
outcome = { default = "Pods restart with 2 GiB. They'll last about twice as long before the next OOM kill." }
teach = "Buys time only; GC pauses get longer as the heap grows, and the leak still wins."

[[scenarios.actions]]
id = "restart"
kind = "mitigate"
label = "Restart all media-api pods"
description = "Rolling restart."
minutes = 2
once = false
quality = "neutral"
transitions = { leaking = "restarted", probe_off = "restarted" }
outcome = { default = "Fresh pods start at about 300 MiB; memory resumes climbing at the same rate." }
teach = "A restart resets the clock and discards the heap you'd need for diagnosis. Fine as a stopgap after capturing a profile."

[[scenarios.actions]]
id = "disable_probe"
kind = "mitigate"
label = "Disable the liveness probe"
description = "Stop Kubernetes from restarting pods during GC pauses."
minutes = 1
quality = "harmful"
mistake = "restart-before-diagnosis"
transitions = { leaking = "probe_off" }
outcome = { default = "Pods are no longer killed during GC pauses; they hang for longer before the OOM kill, and requests now time out instead of failing fast." }
teach = "The probe is reacting correctly to an unhealthy pod. Disabling it hides the symptom and makes failures slower."

[[scenarios.actions]]
id = "scale_out"
kind = "mitigate"
label = "Scale media-api from 5 to 10 pods"
description = "Spread load across more pods."
minutes = 2
quality = "risky"
mistake = "scale-without-bottleneck"
outcome = { default = "10 pods running. Each pod's memory still climbs at about the same rate; restarts continue." }
teach = "Every pod leaks independently: unique URLs are spread across all pods, so each fills at a similar rate."

[[scenarios.root_causes]]
id = "rc-cache"
text = "media-api v4.1.0 added an unbounded lru_cache keyed by full URLs (including tracking parameters), so every pod retains image bytes until it is OOM-killed."
correct = true
explanation = "The heap profile shows 612 MiB in the lru_cache with a 2% hit rate and maxsize=None. Restarts are OOMKilled at the limit on an 11-minute cycle that began with v4.1.0."

[[scenarios.root_causes]]
id = "rc-node"
text = "Node memory pressure from the node-pool update is evicting media-api pods."
explanation = "Restarts are OOMKilled at the container limit, not evictions; the pressure event was brief and affected best-effort pods."

[[scenarios.root_causes]]
id = "rc-gc"
text = "Python's garbage collector pauses are too long and fail liveness probes."
explanation = "Long GC pauses are a symptom of a huge heap. Liveness failures add restarts but don't explain the OOM kills."

[[scenarios.root_causes]]
id = "rc-storage"
text = "Object storage is slow, so requests pile up in memory."
explanation = "Storage p95 is 34 ms with no errors; requests are fast until the pod runs out of memory."

[[scenarios.misleading_signals]]
signal = "CPU spikes before each crash"
why = "Garbage collection working on an ever-larger heap. A consequence of the leak."

[[scenarios.misleading_signals]]
signal = "Node MemoryPressure event and a node-pool update"
why = "One short event 26 minutes ago that evicted best-effort pods; media-api pods are OOMKilled at their own limit."

[scenarios.rubric_focus]
diagnostic_accuracy = "Unbounded lru_cache keyed by high-cardinality URLs, not nodes, GC or storage."
evidence_quality = "OOMKilled at the limit, sawtooth memory, heap profile, the v4.1.0 diff."
mitigation_safety = "Rollback or a bounded cache; avoids disabling probes; treats limit increases and restarts as stopgaps."
long_term_prevention = "Bounded caches, key normalisation, realistic load tests, memory growth alerts."
