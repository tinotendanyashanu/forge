level = "intermediate"

[[scenarios]]
slug = "memory-leak-crashes"
title = "Image service pods keep crashing"
summary = "media-api pods restart every 10-12 minutes and image requests fail in bursts. Figure out what is consuming memory."
business_context = "Pinecrest Travel's media-api (Python, 5 pods, 1 GiB memory limit each) resizes and serves listing photos. Listings without images convert far worse, and partners are reporting broken thumbnails."
skills = ["devops", "python", "system-design"]
competencies = ["performance_analysis", "observability", "reliability", "deployment_engineering", "root_cause_analysis"]
learning_outcomes = [
  "Recognise a leak by its sawtooth: memory rises steadily, then drops at each OOM kill.",
  "Use restart reasons and heap profiles to find what is retained, rather than guessing.",
  "Distinguish 'buys time' mitigations (bigger limits, restarts) from fixes.",
  "Separate GC pauses and CPU spikes (symptoms) from the leak (cause).",
]
initial_symptoms = [
  "Alert: media-api pod restarts > 10 in 30 minutes.",
  "Partners report intermittent 502s on /img/* URLs.",
  "CPU on media-api spikes shortly before each restart.",
]
customer_impact = "About 8% of image requests fail with 502, in bursts every few minutes; listings show broken thumbnails."
start_time = "2026-05-19T11:00:00Z"
history = [[-120, "healthy"], [-48, "leaking"]]
initial_condition = "leaking"
verify_minutes = 12
target_minutes = 25

spoiler_terms = ["unbounded", "lru_cache", "lru cache", "maxsize", "in-memory cache", "in-process cache", "thumbnail cache", "tracking parameters", "utm"]
key_evidence = ["log-oom", "heap-profile", "diff-lru", "artifact-restarts"]
contributing_factors = [
  "The cache key includes the full query string, so tracking parameters make every request a new key.",
  "Load tests replayed a fixed URL list, so the cache never grew in testing.",
  "No alert on memory growth rate; the first alert was restarts.",
  "Liveness probes kill pods during GC pauses, adding restarts.",
]
investigation_path = [
  "Notice the memory sawtooth on every pod, period about 11 minutes.",
  "Confirm restarts are OOMKilled at the 1 GiB limit, not liveness failures alone.",
  "Take a heap profile: one dict-backed cache holds most of the heap.",
  "Line up with media-api v4.1 (thumbnail cache, maxsize=None, key includes query string).",
  "Roll back or bound the cache; verify memory stays flat across a full previous cycle.",
]
explanation = "media-api v4.1 added @lru_cache(maxsize=None) around thumbnail generation, keyed by the full URL. Partners append tracking parameters (utm_*, session ids), so nearly every request creates a new entry holding resized image bytes. The cache never evicts, memory grows about 80 MB per minute per pod, GC works harder (CPU spikes) and the pod is OOM-killed at 1 GiB. Requests in flight on the dying pod return 502. Restarting or raising the limit only resets the clock."
prevention = [
  "Bound in-process caches (maxsize) and normalise cache keys (drop tracking parameters).",
  "Prefer a shared, bounded cache or CDN for image derivatives.",
  "Load-test with realistic, high-cardinality URL sets.",
  "Alert on memory growth rate and OOMKilled restarts separately from availability.",
]

