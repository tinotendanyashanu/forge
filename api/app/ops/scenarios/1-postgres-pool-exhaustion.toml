# ---------------------------------------------------------------- hidden solution

[[scenarios.root_causes]]
id = "rc-leak"
text = "orders-api v3.14.0 stopped closing database sessions when a request raises; expired-coupon checkouts (coupon_validation_v2) leak pooled connections until the pool is exhausted."
correct = true
explanation = "The refactored get_db dependency lost its try/finally, so db.close() is skipped whenever the request raises. validate_coupon_v2 raises CouponExpired for expired coupons (common during the campaign) after opening a transaction with SELECT ... FOR UPDATE. Each such request leaves a connection checked out and idle in transaction. With 60 pooled connections, the pool fills in about 15 minutes and every later request waits the full 30 s pool timeout."

[[scenarios.root_causes]]
id = "rc-traffic"
text = "The spring campaign increased traffic beyond what orders-api and PostgreSQL can handle."
explanation = "Traffic rose about 10%, well under tested capacity (3000 req/min). CPU on orders-api and PostgreSQL is low. Traffic correlates in time with the incident but cannot explain connections held for minutes."

[[scenarios.root_causes]]
id = "rc-slow-query"
text = "A slow or locking query in PostgreSQL is saturating the database."
explanation = "pg_stat_statements shows no query above 50 ms and no lock waits; database CPU is 11%. The sessions are idle, not running."

[[scenarios.root_causes]]
id = "rc-redis"
text = "The Redis session cache is failing, pushing load onto the database."
explanation = "Redis shows a 94% hit rate, no evictions and sub-2 ms latency."

[[scenarios.misleading_signals]]
signal = "Traffic up from the campaign"
why = "It started 47 minutes earlier and is ~10% above normal, far below capacity. Timing correlates loosely; mechanism doesn't fit."

[[scenarios.misleading_signals]]
signal = "Readiness check says 'database unavailable'"
why = "The check fails because it can't get a pool connection. The database itself is up and idle."

[[scenarios.misleading_signals]]
signal = "64 database connections"
why = "High but under max_connections (100). The problem is who holds them (idle in transaction), not how many the database can take."

[scenarios.rubric_focus]
diagnostic_accuracy = "Names the leaked connections from the exception path in v3.14.0, not traffic or the database."
evidence_quality = "Cites pg_stat_activity idle-in-transaction sessions, pool checkout ages and the 30 s timeout."
mitigation_safety = "Prefers flag off or rollback plus pod recycle; avoids scaling and database restarts."
long_term_prevention = "try/finally with a test, idle_in_transaction_session_timeout, pool alerts, gradual rollout."
