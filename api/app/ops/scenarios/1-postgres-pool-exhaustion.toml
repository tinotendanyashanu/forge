# ---------------------------------------------------------------- actions

[[scenarios.actions]]
id = "inspect_db"
kind = "investigate"
label = "Inspect PostgreSQL sessions (pg_stat_activity)"
description = "List database sessions by application and state."
minutes = 2
command = "database-status"
quality = "helpful"
teach = "The database is nearly idle, yet 44 orders-api sessions sit 'idle in transaction' for minutes. Connections are held, not busy."

[[scenarios.actions]]
id = "inspect_pool"
kind = "investigate"
label = "Inspect orders-api connection pool stats"
description = "Per-replica pool usage, waiters and checked-out connection ages."
minutes = 2
quality = "helpful"
teach = "Checked-out connections that are minutes old mean they were never returned to the pool: a leak, not load."

[[scenarios.actions]]
id = "review_diff"
kind = "investigate"
label = "Review the orders-api v3.14.0 diff"
description = "Open the code changes in the deployment that preceded the incident."
minutes = 3
quality = "helpful"
teach = "get_db lost its try/finally. Any exception inside the request (now CouponExpired) skips db.close()."

[[scenarios.actions]]
id = "check_flags"
kind = "investigate"
label = "List feature flags"
description = "Show feature flags and when they last changed."
minutes = 1
quality = "helpful"
teach = "The new code path is behind coupon_validation_v2, so it can be turned off without a deploy."

[[scenarios.actions]]
id = "check_redis"
kind = "investigate"
label = "Check Redis health"
description = "INFO summary for the session cache."
minutes = 1
teach = "Redis is healthy: a reasonable thing to rule out, but not the cause."

[[scenarios.actions]]
id = "traffic_breakdown"
kind = "investigate"
label = "Break down traffic by endpoint"
description = "Compare current request rates to last week."
minutes = 2
teach = "Traffic is up about 10% from the campaign, far below tested capacity. A correlation, not the cause."

[[scenarios.actions]]
id = "slow_queries"
kind = "investigate"
label = "Look for slow queries (pg_stat_statements)"
description = "Top queries by mean execution time."
minutes = 2
teach = "No slow queries and no lock waits: the database is not the bottleneck."

[[scenarios.actions]]
id = "disable_flag"
kind = "mitigate"
discovered_by = ["check_flags", "review_diff"]
label = "Disable feature flag coupon_validation_v2"
description = "Turn off the new coupon validation path for all users."
minutes = 1
quality = "correct"
transitions = { exhausted = "flag_off_exhausted", leaking = "flag_off_exhausted", restarted = "stabilising" }
outcome = { exhausted = "Flag disabled. No new connections should leak, but the ones already leaked are still checked out.", leaking = "Flag disabled. New leaks stop, but already leaked connections are still held.", restarted = "Flag disabled on freshly restarted pods. Connection counts should settle.", default = "Flag disabled." }
teach = "Disabling the flag stops new leaks immediately and is fully reversible. Already leaked connections still need the pods recycled."

[[scenarios.actions]]
id = "restart_api"
kind = "mitigate"
label = "Rolling restart of orders-api"
description = "Restart the 4 replicas one at a time."
minutes = 3
once = false
quality = "neutral"
transitions = { exhausted = "restarted", leaking = "restarted", flag_off_exhausted = "stabilising", worse = "restarted" }
outcome = { exhausted = "Pods restarted with empty pools. Requests succeed again for now.", leaking = "Pods restarted with empty pools.", flag_off_exhausted = "Pods restarted with fresh pools while the leaking path is disabled.", worse = "Pods restarted; total connections drop below the database limit.", default = "Pods restarted." }
