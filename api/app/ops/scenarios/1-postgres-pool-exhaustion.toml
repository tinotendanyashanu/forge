level = "beginner"

[[scenarios]]
slug = "postgres-pool-exhaustion"
title = "Checkout requests hang, then fail with 500s"
summary = "Checkout latency jumped to 30 seconds and errors are climbing. The database looks idle. Find out why requests can't get a connection."
business_context = "Lumen Shop is a mid-sized online store. Checkout runs through orders-api (FastAPI, 4 replicas, SQLAlchemy pool of 10 + 5 overflow per replica) backed by PostgreSQL (max_connections = 100). A spring marketing campaign launched this morning. Every minute of checkout failure loses orders."
skills = ["devops", "sql", "fastapi"]
competencies = ["database_operations", "observability", "root_cause_analysis", "deployment_engineering"]
learning_outcomes = [
  "Read connection-pool symptoms: 30 s waits that match the pool timeout, low CPU everywhere.",
  "Use pg_stat_activity to tell 'busy database' apart from 'leaked idle-in-transaction connections'.",
  "Correlate a deployment and a feature flag with the start of a leak instead of blaming traffic.",
  "Choose a mitigation that stops the leak, and understand why a restart alone only buys time.",
]
initial_symptoms = [
  "Pager: orders-api p95 latency above 5 s for 3 minutes.",
  "Support reports customers stuck on 'Placing order…' and then seeing an error page.",
  "The /readyz health check of orders-api reports 'database unavailable'.",
]
customer_impact = "About one in five checkouts fails after a 30 second wait; the rest are slow."
start_time = "2026-03-14T14:00:00Z"
history = [[-90, "healthy"], [-18, "leaking"], [-3, "exhausted"]]
initial_condition = "exhausted"
verify_minutes = 5
target_minutes = 20

# Hidden solution (never sent before the attempt ends)
spoiler_terms = ["idle in transaction", "leak", "leaked", "leaking", "never returned", "never released", "try/finally", "finally block", "db.close", "get_db", "coupon_validation_v2", "not closing", "isn't closing"]
key_evidence = ["db-activity", "pool-stats", "deploy-diff", "log-pool-timeout"]
contributing_factors = [
  "The dependency refactor had no test for the exception path.",
  "The new code path shipped enabled at 100% instead of a gradual rollout.",
  "No alert on pool checkout age or idle-in-transaction sessions; the first alert was user-facing latency.",
  "The readiness check reports 'database unavailable' for pool exhaustion, pointing responders at the database.",
  "The campaign made expired-coupon errors frequent, accelerating the leak.",
]
investigation_path = [
  "Notice that p95 sits at exactly ~30 s: the pool timeout, not the database.",
  "Check database health: low CPU, no slow queries, but many sessions idle in transaction.",
  "Check pool stats: every connection checked out for minutes.",
  "Line up the timeline: the leak starts right after orders-api v3.14.0 and its flag.",
  "Read the diff: get_db without try/finally plus a new path that raises.",
  "Mitigate: disable the flag (stop the leak) and recycle pods, or roll back.",
]
explanation = "This is a connection leak, not a capacity problem. The signature: latency pinned at the pool timeout, low CPU everywhere, a database full of idle-in-transaction sessions from one application, and connection ages measured in minutes. The traffic increase and the 'database unavailable' health check are misleading signals. The fastest safe fix is to stop the leak (disable the flag or roll back) and release the leaked connections (recycle pods)."
prevention = [
  "Restore try/finally (or a context manager) in get_db and add a test that raises inside a request and asserts the connection is returned.",
  "Set idle_in_transaction_session_timeout on the orders database as a safety net.",
  "Alert on pool waiters, checkout age and idle-in-transaction sessions.",
  "Roll out flagged code paths gradually and watch pool metrics during rollout.",
  "Make /readyz distinguish 'pool exhausted' from 'database unreachable'.",
]


