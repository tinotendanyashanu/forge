[[scenarios.actions]]
id = "versions_running"
kind = "investigate"
label = "Compare error rates by running version"
description = "Group workloads by version and error rate."
minutes = 1
command = "service-status"
quality = "helpful"
teach = "New code works, all old readers fail: the schema changed under them."

[[scenarios.actions]]
id = "migration_log"
kind = "investigate"
label = "Read the migration log"
description = "What the pre-deploy hook ran, with timings."
minutes = 1
quality = "helpful"
teach = "A rename is a contract step: instant to run, instantly breaking for every old reader."

[[scenarios.actions]]
id = "release_plan"
kind = "investigate"
label = "Read the v9.0 release plan"
description = "Steps and listed consumers."
minutes = 1
quality = "helpful"
teach = "billing-worker reads users.email but wasn't in the plan."

[[scenarios.actions]]
id = "db_locks"
kind = "investigate"
label = "Check accounts-db locks and load"
description = "Lock waits, CPU, connections."
minutes = 1
command = "database-status"
teach = "A one-second lock wait during the migration is a red herring: it resolved before the errors started."

[[scenarios.actions]]
id = "revert_rename"
kind = "mitigate"
discovered_by = ["migration_log", "versions_running"]
label = "Revert the rename: ALTER TABLE users RENAME COLUMN email_address TO email"
description = "Metadata-only change; needs a brief AccessExclusiveLock."
minutes = 1
quality = "correct"
transitions = { broken = "reverted_canary", all_old = "stabilising" }
outcome = { broken = "Column restored. v8 pods and billing-worker recover; the v9 canary now fails on email_address.", all_old = "Column restored; every pod is on v8, so everything recovers.", default = "Column renamed back." }
teach = "Restores the contract every old reader depends on, in milliseconds. Do it with a lock_timeout so it can't queue behind a long transaction."

[[scenarios.actions]]
id = "pause_rollout"
kind = "mitigate"
label = "Abort the rollout: route all traffic to v8.7"
description = "Remove the v9.0 canary pods."
minutes = 1
quality = "helpful"
transitions = { broken = "all_old", reverted_canary = "stabilising", all_new = "stabilising" }
outcome = { all_new = "All traffic back on v8.7, which matches the restored users.email column.", broken = "Canary removed. Logins now fail for almost every request.", reverted_canary = "Canary removed; all pods run v8.7 against the restored column.", default = "Canary removed." }
teach = "Correct after reverting the schema, harmful before it: old code can't run on the renamed column."

[[scenarios.actions]]
id = "promote_v9"
kind = "mitigate"
label = "Promote v9.0 to 100% of accounts-api"
description = "Roll forward: every API pod on the new code."
minutes = 3
quality = "helpful"
transitions = { broken = "api_new_worker_broken", reverted_canary = "all_new", stabilising = "all_new", recovered = "all_new" }
outcome = { broken = "All accounts-api pods on v9.0; logins recover. billing-worker is still failing.", reverted_canary = "All pods on v9.0. Every login request now fails.", default = "Promotion complete." }
deployment = { service = "api", version = "v9.0.0", summary = "Promote canary to 100%" }
teach = "A valid roll-forward for the API, but it skips verification and leaves other readers (billing-worker) broken."

[[scenarios.actions]]
id = "deploy_worker_v5"
kind = "mitigate"
label = "Deploy billing-worker v5.0 (reads email_address)"
description = "Ship the worker version that understands the new column."
minutes = 3
requires_actions = ["promote_v9"]
quality = "helpful"
transitions = { api_new_worker_broken = "stabilising" }
outcome = { default = "billing-worker v5.0 rolling out; invoice jobs resume." }
deployment = { service = "worker", version = "v5.0.0", summary = "Read users.email_address" }
teach = "Completes the roll-forward. Only works if v5.0 exists and has been tested; check before relying on it."

[[scenarios.actions]]
id = "migrate_down"
kind = "mitigate"
discovered_by = ["migration_log"]
label = "Run alembic downgrade -1"
description = "Use the migration's own down step."
minutes = 1
quality = "risky"
mistake = "ignore-data-safety"
transitions = { broken = "reverted_canary", all_old = "stabilising" }
outcome = { broken = "Column renamed back, and table email_verifications dropped: 1,204 verification records created since 12:50 are deleted.", default = "Downgrade complete; email_verifications dropped." }
teach = "The down migration also drops a table with new data. Read a down migration before running it in an incident; a targeted rename is safer."

[[scenarios.actions]]
id = "rollback_app"
kind = "mitigate"
label = "Roll back accounts-api to v8.7 everywhere"
description = "Standard application rollback."
minutes = 2
quality = "harmful"
mistake = "rollback-blindly"
transitions = { broken = "all_old" }
outcome = { broken = "All pods on v8.7. Logins now fail for almost every request.", default = "Rollback complete." }
deployment = { service = "api", version = "v8.7.3", summary = "Rollback of v9.0.0" }
teach = "An app rollback only works if the old version is compatible with the current schema. Here it isn't."

[[scenarios.actions]]
id = "restore_backup"
kind = "mitigate"
label = "Restore accounts-db from the 12:00 snapshot"
description = "Point-in-time restore to before the release."
minutes = 2
quality = "harmful"
mistake = "ignore-data-safety"
transitions = { broken = "restoring", all_old = "restoring", reverted_canary = "restoring", api_new_worker_broken = "restoring" }
outcome = { default = "Database offline for the restore; about an hour of signups, password changes and profile edits will be lost." }
teach = "A restore is for data corruption, not a schema mismatch. It turns a partial outage into a full one and loses data."

[[scenarios.root_causes]]
id = "rc-contract"
text = "Release v9.0 ran a destructive contract migration (renaming users.email to email_address) before old readers were retired, breaking the v8 API pods and billing-worker."
correct = true
explanation = "Errors are UndefinedColumn on users.email from v8.7 and billing-worker v4 only; the v9 canary succeeds; the migration log shows the rename ran in the pre-deploy hook at 12:50."

[[scenarios.root_causes]]
id = "rc-lock"
text = "The migration's lock on the users table is blocking queries."
explanation = "The lock wait lasted 1 s and resolved before the errors; errors are UndefinedColumn, not lock timeouts."

[[scenarios.root_causes]]
id = "rc-canary-bug"
text = "A bug in v9.0 is breaking logins."
explanation = "v9.0 is the one version that works; failures come from older readers."

[[scenarios.root_causes]]
id = "rc-index"
text = "The new last_login index (0141) is degrading database performance."
explanation = "It finished 95 minutes ago and database load is normal."

[[scenarios.misleading_signals]]
signal = "AccessExclusiveLock wait in the database log"
why = "One second during the rename, resolved before errors began; failures are UndefinedColumn errors, not timeouts."

[[scenarios.misleading_signals]]
signal = "v8 readiness probes failing"
why = "A symptom: readiness checks query the profile, which hits the missing column."

[[scenarios.misleading_signals]]
signal = "The release dashboard says the canary is healthy"
why = "True: the canary is the only healthy code. Fleet-wide errors are what matter."

[scenarios.rubric_focus]
diagnostic_accuracy = "Contract migration before old readers retired, not locks, canary bugs or the index."
evidence_quality = "UndefinedColumn by version, the migration log, versions-running, the release plan missing billing-worker."
mitigation_safety = "Revert the rename (with lock_timeout) then abort the canary, or roll forward everything; no app rollback, restore or blind downgrade."
long_term_prevention = "Expand/contract across releases, migration linting, consumer inventory, fleet-wide canary analysis."
