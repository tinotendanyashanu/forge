level = "senior"

[[scenarios]]
slug = "zero-downtime-migration"
title = "Logins fail during a 'zero-downtime' release"
summary = "A canary release started nine minutes ago. Since then most logins fail and billing jobs are erroring. The new version looks healthy. Work out what the release did."
business_context = "Quillstack is a B2B SaaS. accounts-api (12 pods) handles login and profiles; billing-worker (deployed separately) generates invoices. Release v9.0 shipped with a database migration run as a pre-deploy hook, then a canary rollout at 10%. Enterprise customers can't log in during their working day."
skills = ["senior-practices", "sql", "devops"]
competencies = ["deployment_engineering", "database_operations", "reliability", "technical_communication", "root_cause_analysis"]
learning_outcomes = [
  "Recognise a contract (destructive) migration that ran before old code was retired.",
  "Use 'which version fails' to reason: the new canary works, everything old breaks.",
  "Choose between reverting a schema change and rolling forward, considering every consumer of the table.",
  "Understand why rolling the application back cannot fix a schema that no longer matches it.",
]
initial_symptoms = [
  "Alert: accounts-api 5xx rate above 50%.",
  "Alert: billing-worker job failures above threshold.",
  "The v9.0 canary pods report healthy; v8.x pods are failing readiness checks intermittently.",
]
customer_impact = "About 90% of login and profile requests fail; invoice generation has stopped."
start_time = "2026-06-23T13:00:00Z"
history = [[-120, "healthy"], [-9, "broken"]]
initial_condition = "broken"
verify_minutes = 5
target_minutes = 20

spoiler_terms = ["rename", "renamed", "email_address", "contract migration", "expand/contract", "expand and contract"]
key_evidence = ["log-undefined-column", "migration-log", "versions-running", "release-plan"]
contributing_factors = [
  "Expand and contract were shipped in one release; the contract step (rename) ran before any old reader was gone.",
  "The pre-deploy hook ran migrations before the canary, so old pods saw the new schema immediately.",
  "billing-worker, a second consumer of users, wasn't in the release plan.",
  "The migration review checklist doesn't flag renames or drops as breaking for running code.",
  "The canary's health only measured the canary pods, so the release looked healthy.",
]
investigation_path = [
  "Group errors by version: v9.0 pods succeed, v8.x pods and billing-worker v4 fail.",
  "Read the error: column users.email does not exist.",
  "Read the migration log: 0142 renamed users.email to email_address in the pre-deploy hook.",
  "List every consumer of users.email: 90% of api pods (v8) and billing-worker v4.",
  "Mitigate by reverting the rename (then abort the canary), or roll forward v9 everywhere including billing-worker.",
]
explanation = "Release v9.0 combined an expand step (code reading email_address) with a contract step (RENAME COLUMN email TO email_address) and ran the migration before the rollout. Renaming is instant, but it breaks every reader that still uses the old name: the 90% of accounts-api pods still on v8 and billing-worker v4, which isn't part of the release. Rolling the app back can't help because the schema no longer has users.email. The fastest safe fix is to rename the column back (a quick metadata change), which restores every old reader, then abort the canary until the change is split into expand (add a column, dual-write, backfill), migrate readers, then contract."
prevention = [
  "Expand/contract across separate releases: add new column, dual-write and backfill, move all readers, then drop or rename.",
  "Run contract migrations only after every consumer of the table is on the new version.",
  "Lint migrations for renames and drops; require an explicit 'breaking for running code' sign-off.",
  "Include every consumer of a table (workers, jobs, reporting) in release plans; consider views for compatibility.",
  "Canary analysis should compare the whole fleet's error rate, not just the canary's.",
]

