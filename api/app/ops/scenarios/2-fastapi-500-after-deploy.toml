[[scenarios.actions]]
id = "review_diff"
kind = "investigate"
label = "Review the orders-api v2.4.0 diff"
description = "Open the code changes in the most recent release."
minutes = 2
quality = "helpful"
teach = "A new required field on the response model: any row without it fails validation at serialisation time."

[[scenarios.actions]]
id = "error_breakdown"
kind = "investigate"
label = "Break down 500s by endpoint and order age"
description = "Slice errors to find what failing requests have in common."
minutes = 2
quality = "helpful"
teach = "Every failure is an order created before March; none after. That points at data shape, not load."

[[scenarios.actions]]
id = "query_data"
kind = "investigate"
label = "Query loyalty_tier NULL counts (read replica)"
description = "Read-only check of how many orders lack a loyalty tier."
minutes = 2
quality = "helpful"
teach = "3.1 M historical orders have NULL. The model's contract doesn't match existing data."

[[scenarios.actions]]
id = "db_health"
kind = "investigate"
label = "Check orders-db health"
description = "CPU, connections, replication lag, locks."
minutes = 1
command = "database-status"
teach = "The database is healthy; the slow analytics query is a long-standing, unrelated job."

[[scenarios.actions]]
id = "rollback"
kind = "mitigate"
label = "Roll back orders-api to v2.3.2"
description = "Redeploy the previous version (no schema changes in v2.4.0)."
minutes = 1
quality = "correct"
transitions = { failing = "rolling_back", restarted = "rolling_back", scaled = "rolling_back" }
outcome = { default = "Rollback started. Pods are being replaced with v2.3.2." }
deployment = { service = "api", version = "v2.3.2", summary = "Rollback of v2.4.0" }
teach = "The safest, fastest mitigation: the release had no migration, so the previous version is fully compatible."

[[scenarios.actions]]
id = "hotfix"
kind = "mitigate"
discovered_by = ["review_diff"]
label = "Ship hotfix v2.4.1: make loyalty_tier Optional[str]"
description = "One-line change, build and roll out (about 6 minutes)."
minutes = 1
requires_actions = ["review_diff"]
quality = "helpful"
transitions = { failing = "hotfixing", restarted = "hotfixing", scaled = "hotfixing" }
outcome = { default = "Hotfix built and rolling out." }
deployment = { service = "api", version = "v2.4.1", summary = "loyalty_tier Optional[str]" }
teach = "A valid forward fix, but slower than a rollback and shipped under pressure. Prefer rollback first, then fix calmly."

[[scenarios.actions]]
id = "restart"
kind = "mitigate"
label = "Restart all orders-api pods"
description = "Rolling restart of the current version."
minutes = 2
quality = "risky"
mistake = "restart-before-diagnosis"
transitions = { failing = "restarted" }
outcome = { default = "Pods restarted on v2.4.0. The same requests still fail." }
teach = "A deterministic code/data mismatch survives restarts. Restarting just costs time."

[[scenarios.actions]]
id = "scale"
kind = "mitigate"
label = "Scale orders-api from 6 to 12 replicas"
description = "Add capacity."
minutes = 2
quality = "risky"
mistake = "scale-without-bottleneck"
transitions = { failing = "scaled", restarted = "scaled" }
outcome = { default = "12 replicas running v2.4.0. CPU per pod drops; the error rate doesn't move." }
teach = "Nothing was saturated. More replicas of a broken version serve the same 500s."

[[scenarios.actions]]
id = "kill_cron"
kind = "mitigate"
label = "Kill the slow analytics query"
description = "Terminate the 1.8 s analytics-cron query."
minutes = 1
quality = "risky"
mistake = "unsafe-database-change"
outcome = { default = "The analytics job is cancelled (data team paged). The 500s continue." }
teach = "The slow query is a misleading signal: long-standing, on a scheduled job, and unrelated to the failing endpoints."

[[scenarios.actions]]
id = "backfill"
kind = "mitigate"
discovered_by = ["query_data", "review_diff"]
label = "Backfill loyalty_tier = 'none' for all NULL orders"
description = "UPDATE 3.1 million rows in production."
minutes = 6
quality = "harmful"
mistake = "unsafe-database-change"
outcome = { default = "The UPDATE runs for 6 minutes, bloats the table and holds row locks; checkout slows. Errors continue until the update commits, and the data now claims a tier that never existed." }
teach = "A mass data change under pressure to satisfy a buggy API contract: slow, risky, and it corrupts meaning. Fix the contract instead."

[[scenarios.root_causes]]
id = "rc-contract"
text = "orders-api v2.4.0 made loyalty_tier a required string in the OrderOut response model, but historical orders have NULL, so FastAPI's response validation raises and returns 500."
correct = true
explanation = "The handler and the query succeed; FastAPI validates the returned object against response_model and raises ResponseValidationError for None. Only pre-March orders have NULL, which is why exactly those requests fail."

[[scenarios.root_causes]]
id = "rc-db"
text = "A slow analytics query is overloading the orders database."
explanation = "The query is long-standing, runs on a schedule and the database is at 31% CPU. Failing traces show the database span succeeding in 3 ms."

[[scenarios.root_causes]]
id = "rc-capacity"
text = "orders-api doesn't have enough replicas for the traffic."
explanation = "CPU is 28-31%, latency is low (failures are fast) and errors are deterministic per order."

[[scenarios.root_causes]]
id = "rc-checkout"
text = "The checkout-service payment SDK upgrade broke order creation."
explanation = "Checkout succeeds; the SDK upgrade was 55 minutes earlier and affects a different service."

[[scenarios.misleading_signals]]
signal = "Slow analytics query warning in the database log"
why = "It has run every 15 minutes since February on a scheduled job; failing requests' database spans take 3 ms."

[[scenarios.misleading_signals]]
signal = "checkout-service deployed earlier"
why = "Different service, different endpoint, 55 minutes before the errors started."

[scenarios.rubric_focus]
diagnostic_accuracy = "Response-model contract vs NULL historical data, not database or capacity."
evidence_quality = "Cites ResponseValidationError on loyalty_tier and the old-vs-new order split."
mitigation_safety = "Rollback first (no migration), avoids mass backfills and restarts."
long_term_prevention = "Optional fields with defaults, old-shaped fixtures in tests, canaries."
