level = "beginner"

[[scenarios]]
slug = "fastapi-500-after-deploy"
title = "Order history returns HTTP 500 after a release"
summary = "Minutes after orders-api v2.4.0 shipped, a third of order-history requests return 500. Work out which requests fail and why."
business_context = "Tidewater Books lets customers view past orders and download invoices. orders-api is a FastAPI service with 6 replicas behind an API gateway. Support tickets are rising, and customers can't download invoices for returns."
skills = ["fastapi", "http", "devops"]
competencies = ["http_debugging", "deployment_engineering", "observability", "root_cause_analysis"]
learning_outcomes = [
  "Use the error log's exception type to tell a response-validation failure from an application bug or a database error.",
  "Find the request property that separates failing from succeeding requests (here: old vs new orders).",
  "Decide between a rollback and a forward fix based on risk and data compatibility.",
]
initial_symptoms = [
  "Alert: orders-api 5xx rate above 5% for 4 minutes.",
  "Support: 'My order history page shows Something went wrong'.",
  "Only GET /api/orders/{id} and GET /api/orders are affected; checkout works.",
]
customer_impact = "About 35% of order-history and invoice requests fail; new orders and checkout are unaffected."
start_time = "2026-04-02T09:30:00Z"
history = [[-90, "healthy"], [-11, "failing"]]
initial_condition = "failing"
verify_minutes = 5
target_minutes = 15

spoiler_terms = ["loyalty_tier", "response_model", "response model", "older orders", "historical orders", "before march", "pre-march"]
key_evidence = ["log-validation-error", "diff-order-schema", "artifact-null-counts"]
contributing_factors = [
  "Test fixtures only contained orders created after the loyalty feature, all with a tier.",
  "No canary: the release went to all 6 replicas at once.",
  "The 5xx alert fires on rate, not on the first ResponseValidationError after a deploy.",
]
investigation_path = [
  "See that errors start right after the v2.4.0 rollout and only hit order read endpoints.",
  "Read the error log: ResponseValidationError for loyalty_tier, input None.",
  "Compare failing and succeeding request ids: failing orders are older.",
  "Check the data: 3.1 M orders predate loyalty tiers and have NULL.",
  "Roll back (fast, safe: no migration) or ship the Optional[...] fix.",
]
explanation = "FastAPI validates responses against response_model. v2.4.0 added a required loyalty_tier: str field to OrderOut. Orders created before the loyalty programme have loyalty_tier = NULL, so serialising them raises ResponseValidationError, which FastAPI turns into a 500. The database and the code paths are fine; the contract is wrong for existing data. Rolling back is safe because the release made no schema change."
prevention = [
  "Make new response fields Optional (or give them defaults) when existing rows may lack them.",
  "Add tests that serialise old-shaped fixtures, including NULLs, through every response model.",
  "Canary releases with automated rollback on a 5xx increase.",
  "Alert on new exception types appearing after a deploy.",
]

