level = "advanced"

[[scenarios]]
slug = "worker-queue-backlog"
title = "Notification queue backlog keeps growing"
summary = "Order confirmations and password-reset emails stopped going out 20 minutes ago. The queue is growing and the workers keep restarting."
business_context = "Meridian Market sends transactional email (order confirmations, password resets, shipping updates) through a RabbitMQ queue consumed by notify-worker (6 replicas, prefetch 1). Password-reset emails that never arrive lock customers out; missing confirmations trigger support contacts and chargebacks."
skills = ["distributed-systems", "python", "devops"]
competencies = ["distributed_systems", "reliability", "observability", "deployment_engineering", "root_cause_analysis"]
learning_outcomes = [
  "Recognise a poison message: a few messages redelivered thousands of times while consumers crash-loop.",
  "Explain why requeue-on-failure without a dead-letter queue turns one bad message into a full outage.",
  "Trace a consumer failure back to a producer's contract change.",
  "Drain a backlog safely without losing messages.",
]
initial_symptoms = [
  "Alert: notifications queue depth above 5,000 and rising.",
  "Alert: notify-worker restarts > 30 in 15 minutes.",
  "Support: customers aren't receiving password-reset emails.",
]
customer_impact = "No transactional email has been delivered for 20 minutes; password resets are blocked and the backlog grows by about 400 messages a minute."
start_time = "2026-10-12T07:40:00Z"
history = [[-120, "healthy"], [-21, "stuck"]]
initial_condition = "stuck"
verify_minutes = 6
target_minutes = 25

spoiler_terms = ["poison", "dead-letter", "dead letter", "dlq", "requeue", "requeued", "contact.email", "guest order", "guest checkout", "schema_version"]
key_evidence = ["log-traceback", "queue-stats", "poison-sample", "producer-diff"]
contributing_factors = [
  "The consumer nacks with requeue=true on any exception and the queue has no dead-letter exchange or redelivery limit.",
  "No message schema contract or consumer-driven contract test between orders-api and notify-worker.",
  "prefetch=1 means a crashing consumer redelivers the same message to the next worker immediately.",
  "Alerts cover queue depth but not message age or redelivery count.",
]
investigation_path = [
  "See that workers are crash-looping, not slow: processing rate is near zero while depth grows.",
  "Read the worker traceback: TypeError on customer email for guest orders.",
  "Inspect the queue: a few messages with thousands of redeliveries at the head.",
  "Sample a message: email moved to customer.contact.email and is null at the old path.",
  "Line up with orders-api v8.1 (guest checkout payload change).",
  "Dead-letter the poison messages (or ship a tolerant consumer), then drain and replay safely.",
]
explanation = "orders-api v8.1 changed the order_confirmed payload for guest checkouts: customer.email became null and the address moved to customer.contact.email. notify-worker indexes customer['email'].lower() and crashes on None. It nacks with requeue=true and the queue has no dead-letter exchange, so the same few poison messages are redelivered to every worker in turn; each crash restarts the pod. With all six workers cycling through poison messages, nothing else is processed and the backlog grows. Dead-lettering after a few attempts lets healthy messages flow; a tolerant consumer (or rolling back the producer) stops new poison."
prevention = [
  "Dead-letter exchange with a redelivery limit on every work queue.",
  "Catch per-message errors in consumers; never crash the process on bad input.",
  "Versioned message schemas and consumer-driven contract tests between producer and consumer.",
  "Alert on oldest-message age and redelivery counts, not only depth.",
  "A replay tool for dead-lettered messages with idempotent consumers.",
]

