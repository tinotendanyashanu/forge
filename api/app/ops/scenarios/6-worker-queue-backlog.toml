[[scenarios.actions]]
id = "worker_logs"
kind = "investigate"
label = "Read notify-worker crash logs"
description = "Tracebacks from the crash-looping pods."
minutes = 1
quality = "helpful"
teach = "The process crashes on customer['email'] being None, then exits without acking."

[[scenarios.actions]]
id = "inspect_queue"
kind = "investigate"
label = "Inspect the notifications queue"
description = "Depth, consumers, redelivery counts, dead-letter policy."
minutes = 2
quality = "helpful"
teach = "A handful of messages at the head have thousands of redeliveries and there is no dead-letter policy: textbook poison messages."

[[scenarios.actions]]
id = "sample_message"
kind = "investigate"
label = "Read the payload of the most redelivered message"
description = "Fetch m-0a91f without acking it."
minutes = 1
requires_actions = ["inspect_queue"]
quality = "helpful"
teach = "Guest orders now carry email under customer.contact; the old field is null."

[[scenarios.actions]]
id = "review_diff"
kind = "investigate"
label = "Review the orders-api v8.1.0 event diff"
description = "See how the producer's payload changed."
minutes = 2
quality = "helpful"
teach = "A producer contract change without a consumer update."

[[scenarios.actions]]
id = "check_email"
kind = "investigate"
label = "Check the email provider"
description = "Provider status and our send rate."
minutes = 1
teach = "The provider is healthy; we just aren't sending anything."

[[scenarios.actions]]
id = "enable_dlq"
kind = "mitigate"
discovered_by = ["inspect_queue", "worker_logs"]
label = "Apply a dead-letter policy (delivery-limit 3) to the queue"
description = "Messages that fail 3 times move to notifications.dlq instead of being requeued."
minutes = 1
quality = "correct"
transitions = { stuck = "draining", scaled = "draining", no_new_poison = "draining" }
outcome = { default = "Poison messages are dead-lettered after 3 attempts. Workers stop crashing on them and start draining the backlog." }
teach = "Isolates bad messages without losing them; they can be fixed and replayed later. New guest-order messages will dead-letter too until the consumer is fixed."

[[scenarios.actions]]
id = "hotfix_consumer"
kind = "mitigate"
discovered_by = ["worker_logs", "sample_message"]
label = "Hotfix notify-worker: read contact.email and catch per-message errors"
description = "Tolerant consumer that nacks without requeue on bad input (build and roll out)."
minutes = 4
requires_actions = ["worker_logs"]
quality = "correct"
transitions = { stuck = "draining", scaled = "draining", no_new_poison = "draining" }
outcome = { default = "Workers on v3.6.3 handle both payload shapes and no longer crash on bad input; the backlog drains." }
deployment = { service = "worker", version = "v3.6.3", summary = "Tolerant order_confirmed handler" }
teach = "Fixes the consumer for both payload versions. Slower than a policy change, but it also delivers guest-order emails."

[[scenarios.actions]]
id = "rollback_producer"
kind = "mitigate"
label = "Roll back orders-api to v8.0.4"
description = "Stop producing the new payload shape."
minutes = 2
quality = "helpful"
transitions = { stuck = "no_new_poison", scaled = "no_new_poison" }
outcome = { default = "orders-api v8.0.4 is live. notify-worker pods are still restarting and the queue is still growing." }
deployment = { service = "api", version = "v8.0.4", summary = "Rollback of v8.1.0" }
teach = "Stops new poison, but doesn't unblock the queue on its own. Also check whether v8.1 wrote data that v8.0 can't read."

[[scenarios.actions]]
id = "restart_workers"
kind = "mitigate"
label = "Restart all notify-worker pods"
description = "Rolling restart."
minutes = 1
once = false
quality = "risky"
mistake = "restart-before-diagnosis"
outcome = { default = "Workers restart, and within a minute they are restarting again." }
teach = "Restarting a consumer doesn't change the message it will receive next."

[[scenarios.actions]]
id = "scale_workers"
kind = "mitigate"
label = "Scale notify-worker from 6 to 12 replicas"
description = "More consumers to chew through the backlog."
minutes = 2
quality = "risky"
mistake = "scale-without-bottleneck"
transitions = { stuck = "scaled" }
outcome = { default = "12 workers running, all restarting repeatedly. Restart events double." }
teach = "Throughput isn't the problem: every consumer is blocked by the same message."

[[scenarios.actions]]
id = "purge_queue"
kind = "mitigate"
discovered_by = ["inspect_queue"]
label = "Purge the notifications queue"
description = "Delete every message in the queue."
minutes = 1
quality = "harmful"
mistake = "ignore-data-safety"
transitions = { stuck = "purged", scaled = "purged", no_new_poison = "recovered" }
outcome = { stuck = "8,512 messages deleted: order confirmations and password resets are lost. New guest orders produce poison again within minutes.", no_new_poison = "Queue purged. Workers recover, but 8,500 customer emails are permanently lost.", default = "Queue purged; messages lost." }
teach = "Purging 'fixes' the graph by destroying customer messages, and with the producer unchanged the poison comes straight back."

[[scenarios.root_causes]]
id = "rc-poison"
text = "orders-api v8.1 sends guest-order events with customer.email = null; notify-worker crashes on them and requeues them forever (no dead-letter queue), so poison messages block every consumer."
correct = true
explanation = "Tracebacks show AttributeError on customer['email']; the head of the queue holds a few messages redelivered thousands of times; the payload has email under customer.contact; this started right after v8.1.0."

[[scenarios.root_causes]]
id = "rc-email-provider"
text = "The email provider is down, so workers can't send."
explanation = "The provider is operational; our send rate is near zero because workers crash before calling it."

[[scenarios.root_causes]]
id = "rc-capacity"
text = "There aren't enough workers for the publishing rate."
explanation = "Before the incident 6 workers processed 410 messages/min easily; now they process about 3 because they crash, not because they're slow."

[[scenarios.root_causes]]
id = "rc-rabbit"
text = "RabbitMQ is unhealthy and dropping consumer connections."
explanation = "Consumers disconnect because their processes exit on an exception; the broker is fine."

[[scenarios.misleading_signals]]
signal = "consumers=0 and channel-closed warnings in the broker"
why = "Consumers disappear because worker processes crash; the broker is reporting it, not causing it."

[[scenarios.misleading_signals]]
signal = "Email send rate near zero"
why = "Workers never reach the provider; the provider itself is healthy."

[scenarios.rubric_focus]
diagnostic_accuracy = "Poison messages from the producer change, plus infinite requeue without a DLQ."
evidence_quality = "Traceback, redelivery counts, the payload sample, the producer diff."
mitigation_safety = "Dead-letter or a tolerant consumer; never purge; restarts and scaling don't help."
long_term_prevention = "DLQ and delivery limits, per-message error handling, schema contracts, age and redelivery alerts."
