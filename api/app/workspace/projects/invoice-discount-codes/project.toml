visibility = "public"
suite = "node"
call = "summarize"
competency = "frontend"
args_json = '''[{"id": 1, "customer": "A", "lines": [], "discount_code": "WELCOME10", "subtotal_cents": 2000, "discount_cents": 200, "total_cents": 1800}]'''
