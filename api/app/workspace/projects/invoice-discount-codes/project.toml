[[tests]]
name = "Discount row uses the formatted negative amount"
visibility = "hidden"
suite = "node"
call = "summarize"
competency = "frontend"
args_json = '''[{"id": 2, "customer": "B", "lines": [], "discount_code": "VIP25", "subtotal_cents": 1005, "discount_cents": 251, "total_cents": 754}]'''
