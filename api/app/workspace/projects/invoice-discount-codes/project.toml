[[exercises]]
slug = "multi-currency-change"
kind = "requirement_change"
title = "Requirement change: invoices in EUR and GBP"
prompt = """
Two days before launch, Sales signs a European customer. Product now asks for
invoices in **EUR and GBP** as well as USD, and wants discount codes to work for
all three. Some codes may later be **fixed amounts** (for example *€5 off*)
rather than percentages.

Assess the impact on your implementation (database, API, rounding, web app,
existing invoices) and propose a plan. Say what you would ship for the launch
and what you would defer, and what you need to clarify with Product or Finance.
"""
rubric = [
  "Identifies the affected layers: currency on invoices and amounts, API contract, formatting in the web app, existing data.",
  "Treats money correctly: integer minor units per currency, no mixing currencies, rounding rules per currency confirmed with Finance.",
  "Plans a backward-compatible migration (e.g. currency column defaulting to USD) and API compatibility for existing clients.",
  "Separates launch scope from later work (fixed-amount codes, code-currency rules) with a clear rationale.",
  "Lists concrete questions for Product/Finance (exchange rates? per-currency codes? minimums?).",
]

[[exercises]]
slug = "migration-rollout-plan"
kind = "deployment_plan"
title = "Deployment and rollback plan for the migration"
prompt = """
The invoices table in production has 4 million rows and is written to
constantly. Write the deployment and rollback plan for this feature: the order
of the migration, backend and web releases; what happens to requests in flight
during the deploy; how you'd verify success; and exactly how you would roll back
if discounts are calculated wrongly after release.
"""
rubric = [
  "Orders the release safely: additive migration first, then backend that tolerates both schemas, then the web app.",
  "Considers the cost of the ALTER on a large, busy table and how to limit locking or impact.",
  "Defines verification: metrics, logs or queries that show discounts are correct after release.",
  "Gives a concrete rollback: feature flag or code rollback without dropping columns, and how to correct wrongly stored discounts.",
  "Communicates with stakeholders (Finance, Support) about timing and risk.",
]
