prompt = """
The Head of Finance asks you directly: *"How did we charge people twice, how do
we know it won't happen again, and can the balances we reported last month be
trusted?"* Write the reply. Be honest about what you know and don't know.
"""
rubric = [
  "Explains the race in plain language (two simultaneous attempts both seeing 'not paid yet').",
  "Explains why the fix holds (the database enforces one payment per key and atomic debits), without jargon.",
  "Addresses last month's balances honestly: what reconciliation can confirm, and what needs checking.",
  "States how the team will detect a recurrence (reconciliation alerts, metrics).",
]

[[exercises]]
slug = "zero-downtime-constraint"
kind = "deployment_plan"
title = "Ship the unique constraint without downtime"
prompt = """
Production's `payments` table has 60 million rows, **including the historical
duplicate keys from the incident**, and takes 400 writes per second. Your
migration adds a UNIQUE constraint on `idempotency_key`.

Write the rollout plan: how to deal with existing duplicates, how to build the
constraint without blocking writes, the order of deploying code and schema, how
to verify, and how to roll back.
"""
rubric = [
  "Recognises the migration would fail (existing duplicates) or lock the table, and plans for both.",
  "Resolves historical duplicates safely (identify, keep the original, coordinate with Finance) before enforcing.",
  "Uses a non-blocking approach (CREATE UNIQUE INDEX CONCURRENTLY, then ADD CONSTRAINT ... USING INDEX).",
  "Orders code and schema changes so each step is safe if the next is delayed, and defines verification.",
  "Gives a realistic rollback for each step.",
]

[[exercises]]
slug = "review-alternative-design"
kind = "review_junior_code"
title = "Review a teammate's alternative fix"
prompt = """
A teammate opened a competing fix: it wraps `process_payment` in a
`threading.Lock()` held for the whole function, plus `SET TRANSACTION
ISOLATION LEVEL SERIALIZABLE` "to be extra safe". Their tests pass locally.

Write the code review you would leave: what is right, what is wrong, what would
happen in production, and what you'd ask them to change. Be kind and specific.
"""
rubric = [
  "Explains why a process-local lock does not protect multiple API processes.",
  "Discusses SERIALIZABLE trade-offs: serialization failures need retry logic; throughput and latency costs.",
  "Recognises what the teammate got right and keeps the tone constructive.",
  "Proposes a concrete alternative and how to test it under real concurrency.",
]
