slug = "lru-cache"
title = "LRU cache"
area = "algorithms"
skill = "python"
prerequisites = ["programming-fundamentals"]
difficulty = "intermediate"
entrypoint = "LRUCache"
time_limit_ms = 2000
memory_limit_mb = 64
description = """
Implement `LRUCache(capacity)` with `get(key)` (return the value or `-1`) and
`put(key, value)`. When full, `put` evicts the least recently used key. Both
operations must be O(1) on average. A `get` counts as a use.
"""
constraints = ["1 <= capacity <= 10000", "Do not use functools.lru_cache."]
rubric = [
  "get refreshes recency; put on an existing key updates the value and recency.",
  "Evicts exactly the least recently used key when over capacity.",
  "O(1) operations using an ordered dict or a hash map plus linked list.",
]
misconceptions = [
  "Forgetting that get() makes a key most recently used.",
  "Evicting on put of an existing key even though the size doesn't grow.",
]
hints = ["collections.OrderedDict can move a key to the end in O(1).", "Updating an existing key shouldn't trigger an eviction."]

[languages.python]
starter = '''
class LRUCache:
    def __init__(self, capacity: int) -> None:
        raise NotImplementedError

    def get(self, key: int) -> int:
        raise NotImplementedError

    def put(self, key: int, value: int) -> None:
        raise NotImplementedError
'''
reference = '''
from collections import OrderedDict


class LRUCache:
    def __init__(self, capacity: int) -> None:
        self.capacity = capacity
        self.data: OrderedDict[int, int] = OrderedDict()

    def get(self, key: int) -> int:
        if key not in self.data:
            return -1
        self.data.move_to_end(key)
        return self.data[key]

    def put(self, key: int, value: int) -> None:
        if key in self.data:
            self.data.move_to_end(key)
        self.data[key] = value
        if len(self.data) > self.capacity:
            self.data.popitem(last=False)
'''

[driver.python]
code = '''
def ops(solution, capacity, operations):
    cache = solution.LRUCache(capacity)
    out = []
    for op in operations:
        if op[0] == "get":
            out.append(cache.get(op[1]))
        else:
            cache.put(op[1], op[2])
            out.append(None)
    return out

def many(solution, n):
    cache = solution.LRUCache(1000)
    for i in range(n):
        cache.put(i, i)
        cache.get(i - 500)
    return [cache.get(n - 1), cache.get(0)]
'''

[[tests]]
name = "Evicts least recently used"
visibility = "public"
call = "driver:ops"
args = [2, [["put", 1, 1], ["put", 2, 2], ["get", 1], ["put", 3, 3], ["get", 2], ["get", 3]]]
expected_json = "[null, null, 1, null, -1, 3]"

[[tests]]
name = "Missing key returns -1"
visibility = "public"
call = "driver:ops"
args = [1, [["get", 7]]]
expected = [-1]

[[tests]]
name = "get refreshes recency"
visibility = "hidden"
call = "driver:ops"
args = [2, [["put", 1, 1], ["put", 2, 2], ["get", 1], ["put", 3, 3], ["get", 1], ["get", 2]]]
expected_json = "[null, null, 1, null, 1, -1]"

[[tests]]
name = "Updating a key doesn't evict"
visibility = "hidden"
call = "driver:ops"
args = [2, [["put", 1, 1], ["put", 2, 2], ["put", 1, 10], ["get", 1], ["get", 2]]]
expected_json = "[null, null, null, 10, 2]"

[[tests]]
name = "Capacity one"
visibility = "hidden"
call = "driver:ops"
args = [1, [["put", 1, 1], ["put", 2, 2], ["get", 1], ["get", 2]]]
expected_json = "[null, null, -1, 2]"

[[tests]]
name = "Many operations stay fast"
visibility = "hidden"
call = "driver:many"
args = [200000]
expected = [199999, -1]
