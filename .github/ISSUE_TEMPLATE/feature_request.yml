name: Feature proposal
description: Propose a focused improvement to the local learning experience.
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem and learning value. FORGE 1.0 is local-only and single-user; public hosting and multi-user access are not existing capabilities. A proposal is not a delivery commitment. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected learner workflow
      description: Explain a concrete situation and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe a focused improvement and how someone could tell it works.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and safety implications
      description: Discuss scoring, advisory AI, learning evidence, data handling or execution boundaries if affected.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: contribution
    attributes:
      label: Possible contribution
      description: Optional. Explain what you could help research, implement, document or validate after scope and licensing are settled.
